<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">两个 skill 串联研究数据与成果表达</title>
  <desc id="desc">从研究问题、影像选择、日期协调镶嵌到可编辑 PPTX 重建的五步工作流。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1400" height="680" fill="#f7f8fa"/>
  <rect x="44" y="34" width="1312" height="612" rx="22" fill="#ffffff" stroke="#d8dee7" stroke-width="2"/>
  <text x="78" y="90" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#172033">From pixels to presentation</text>
  <text x="78" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#64748b">NightSensingLab · New skill release · 2026.08</text>
  <rect x="1115" y="68" width="198" height="40" rx="20" fill="#eef2f6"/>
  <text x="1214" y="94" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#334155">RESEARCH WORKFLOW</text>

  <line x1="282" y1="350" x2="316" y2="350" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="552" y1="350" x2="586" y2="350" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="822" y1="350" x2="856" y2="350" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1092" y1="350" x2="1126" y2="350" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(72 176)">
    <rect width="210" height="350" rx="16" fill="#eef5ff" stroke="#a6c7f5" stroke-width="2"/>
