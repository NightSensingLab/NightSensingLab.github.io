    <circle cx="34" cy="38" r="18" fill="#d9822b"/>
    <text x="34" y="44" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#fff">04</text>
    <text x="24" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#7a4516">分层 PPTX</text>
    <text x="24" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#7a4516">重建</text>
    <text x="24" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#8a5a28">文字可编辑</text>
    <text x="24" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#8a5a28">复杂视觉保真</text>
    <rect x="24" y="239" width="162" height="42" rx="8" fill="#ffebc9"/>
    <text x="105" y="257" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="10.5" font-weight="600" fill="#7a4516">PPT Screenshot to Editable</text>
    <text x="105" y="273" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="10.5" font-weight="600" fill="#7a4516">PPTX</text>
  </g>

  <g transform="translate(1152 176)">
    <rect width="176" height="350" rx="16" fill="#fff0f0" stroke="#e5a7a7" stroke-width="2"/>
    <circle cx="34" cy="38" r="18" fill="#c44949"/>
    <text x="34" y="44" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#fff">05</text>
    <text x="24" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#7d2626">可复用</text>
    <text x="24" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#7d2626">成果</text>
    <text x="24" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#914343">选景报告</text>
    <text x="24" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#914343">可编辑演示稿</text>
    <text x="24" y="245" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#7d2626">REUSE / SHARE</text>
