<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">PPT Screenshot to Editable PPTX 分层重建示意图</title>
  <desc id="desc">整页截图被拆分为复杂视觉资产、原生可编辑文字和结构渲染验证层，最终生成完整的 16:9 PPTX。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#f7f8fa"/>
  <rect x="44" y="34" width="1312" height="692" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/>
  <text x="78" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#172033">PPT Screenshot to Editable PPTX</text>
  <text x="78" y="121" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#64748b">复杂视觉保真 + 主要文字可编辑 + 交付前全量验证</text>

  <g transform="translate(80 180)">
    <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#334155">01 / 输入</text>
    <rect x="0" y="28" width="276" height="218" rx="12" fill="#f5f7fa" stroke="#aeb9c7" stroke-width="2"/>
    <rect x="22" y="50" width="232" height="130" rx="5" fill="#1e3a6f"/>
    <rect x="38" y="66" width="92" height="18" rx="3" fill="#84b5ea"/>
    <rect x="38" y="101" width="174" height="9" rx="4" fill="#d9e8fa"/>
    <rect x="38" y="120" width="138" height="9" rx="4" fill="#d9e8fa"/>
    <rect x="38" y="150" width="70" height="17" rx="3" fill="#e6a55a"/>
    <rect x="132" y="150" width="62" height="17" rx="3" fill="#8fc9a8"/>
    <text x="138" y="208" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#64748b">高清截图 / 扫描页</text>
    <text x="0" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#64748b">批量输入清点 · 预期页数检查</text>
  </g>

  <line x1="392" y1="330" x2="445" y2="330" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(470 180)">
    <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#334155">02 / 分层重建</text>
    <rect x="0" y="28" width="420" height="364" rx="14" fill="#fbfcfd" stroke="#d8dee7" stroke-width="2"/>
    <rect x="28" y="58" width="364" height="80" rx="10" fill="#fff0d8" stroke="#e6b76e" stroke-width="2"/>
    <text x="52" y="91" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#8d551d">复杂视觉资产</text>
    <text x="52" y="117" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#9a6b35">地图 · 遥感影像 · 纹理 · 复杂图表主体</text>
    <rect x="28" y="156" width="364" height="80" rx="10" fill="#e8f4ff" stroke="#9ec4ee" stroke-width="2"/>
    <text x="52" y="189" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#285d9e">原生可编辑文字</text>
    <text x="52" y="215" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#4e75a1">标题 · 正文 · 关键数字 · 页脚与页码</text>
    <rect x="28" y="254" width="364" height="80" rx="10" fill="#edf9f3" stroke="#a2d8bb" stroke-width="2"/>
    <text x="52" y="287" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#277653">结构与渲染 QA</text>
    <text x="52" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#4c8068">页数 · XML · 媒体关系 · 逐页视觉对照</text>
    <text x="28" y="366" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" fill="#64748b">可编辑性与视觉保真按层管理</text>
  </g>

  <line x1="930" y1="330" x2="983" y2="330" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(1008 180)">
    <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#334155">03 / 交付</text>
    <rect x="0" y="28" width="270" height="218" rx="12" fill="#fff7ef" stroke="#e1b37f" stroke-width="2"/>
    <rect x="22" y="52" width="226" height="128" rx="5" fill="#fff" stroke="#c8752b" stroke-width="2"/>
    <rect x="38" y="68" width="92" height="15" rx="3" fill="#2f6fed"/>
    <text x="38" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#1e3a6f">可编辑标题</text>
    <text x="38" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" fill="#64748b">正文与关键数字可修改</text>
    <rect x="38" y="150" width="75" height="15" rx="3" fill="#e7a65d"/>
    <rect x="121" y="150" width="73" height="15" rx="3" fill="#8fc9a8"/>
    <text x="135" y="208" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#8d551d">完整 16:9 PPTX</text>
    <text x="0" y="286" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#64748b">最新验证版本 · 可继续编辑与复用</text>
  </g>

  <rect x="80" y="552" width="1198" height="82" rx="14" fill="#f1f3f5"/>
  <text x="108" y="585" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" font-weight="700" fill="#334155">交付门槛</text>
  <text x="108" y="613" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#64748b">输入页数 = PPTX 页数 = 渲染页数；同时检查原生文字、媒体关系和整页图片候选。</text>
</svg>
