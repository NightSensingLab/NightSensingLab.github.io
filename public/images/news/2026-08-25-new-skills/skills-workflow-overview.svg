    <text x="24" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#1e3a6f">研究问题</text>
    <text x="24" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#34527f">ROI / 数据集</text>
    <text x="24" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#34527f">时间范围 / 质量约束</text>
    <line x1="24" y1="188" x2="186" y2="188" stroke="#c3d8f4"/>
    <text x="24" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#1e3a6f">INPUT</text>
    <text x="24" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#34527f">研究区与研究目标</text>
    <text x="24" y="282" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#34527f">可解释的筛选条件</text>
  </g>

  <g transform="translate(342 176)">
