<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">GEE Tile Temporal Mosaic 选景与日期协调示意图</title>
  <desc id="desc">研究区由多个影像 tile 覆盖，候选场景根据云量、覆盖率和日期差进行联合排序。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1400" height="760" fill="#f7f8fa"/>
  <rect x="44" y="34" width="1312" height="692" rx="22" fill="#fff" stroke="#d8dee7" stroke-width="2"/>
  <text x="78" y="88" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="28" font-weight="700" fill="#172033">GEE Tile Temporal Mosaic</text>
  <text x="78" y="121" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" fill="#64748b">从最少几何 tile 到日期协调的研究级镶嵌</text>

  <g transform="translate(82 170)">
    <rect width="460" height="480" rx="16" fill="#f4f8ff" stroke="#b6cdf2" stroke-width="2"/>
    <text x="28" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#234478">01 / 空间覆盖</text>
    <text x="28" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#587092">ROI 与 tile footprint 的增量覆盖面积</text>
    <rect x="62" y="114" width="320" height="272" rx="12" fill="#e4edf8" stroke="#9eb7d8"/>
    <path d="M90 150L238 128L362 182L332 340L172 365L76 280Z" fill="#ffe0bd" stroke="#c8752b" stroke-width="3"/>
    <text x="212" y="257" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="20" font-weight="700" fill="#8b4f1e">ROI</text>
    <path d="M68 120H204V390H68Z" fill="#78a7e5" fill-opacity=".28" stroke="#4d82cb" stroke-width="2"/>
    <path d="M204 120H340V390H204Z" fill="#74cba1" fill-opacity=".3" stroke="#319566" stroke-width="2"/>
    <path d="M340 120H392V390H340Z" fill="#e4a55f" fill-opacity=".34" stroke="#c8752b" stroke-width="2"/>
    <text x="136" y="420" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" fill="#38649c">TILE A</text>
    <text x="272" y="420" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" fill="#24724e">TILE B</text>
    <text x="366" y="420" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" fill="#985c22">TILE C</text>
    <rect x="28" y="441" width="404" height="1" fill="#c9d7e9"/>
    <text x="28" y="465" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#587092">选择目标：覆盖完整、重复最少、保留 provenance</text>
  </g>

  <line x1="558" y1="412" x2="610" y2="412" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="582" y="390" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" fill="#64748b">联合评估</text>

  <g transform="translate(638 170)">
    <rect width="628" height="480" rx="16" fill="#fbfcfd" stroke="#d8dee7" stroke-width="2"/>
    <text x="28" y="42" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="17" font-weight="700" fill="#263548">02 / 候选场景与质量排序</text>
    <text x="28" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#64748b">硬约束先筛选，再按日期差、云量和覆盖率排序</text>
    <g transform="translate(28 98)">
      <rect width="572" height="64" rx="10" fill="#fff" stroke="#d8dee7"/>
      <circle cx="24" cy="32" r="14" fill="#d9e7fb"/><text x="24" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#2f6fed">A</text>
      <text x="52" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#334155">2025-06-04 · cloud 8%</text>
      <text x="52" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" fill="#64748b">coverage 99% · date delta 0 d</text>
      <rect x="468" y="18" width="80" height="28" rx="14" fill="#d9f2e5"/><text x="508" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#18734b">SELECT</text>
    </g>
    <g transform="translate(28 174)">
      <rect width="572" height="64" rx="10" fill="#fff" stroke="#d8dee7"/>
      <circle cx="24" cy="32" r="14" fill="#e6edf6"/><text x="24" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#56708d">B</text>
      <text x="52" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#334155">2025-06-08 · cloud 4%</text>
      <text x="52" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" fill="#64748b">coverage 96% · date delta 4 d</text>
      <rect x="468" y="18" width="80" height="28" rx="14" fill="#f1f3f5"/><text x="508" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#64748b">BACKUP</text>
    </g>
    <g transform="translate(28 250)">
      <rect width="572" height="64" rx="10" fill="#fff" stroke="#d8dee7"/>
      <circle cx="24" cy="32" r="14" fill="#fbe7ce"/><text x="24" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#a25b1d">C</text>
      <text x="52" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#334155">2025-06-19 · cloud 2%</text>
      <text x="52" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" fill="#64748b">coverage 88% · date delta 15 d</text>
      <rect x="468" y="18" width="80" height="28" rx="14" fill="#fff0d8"/><text x="508" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#a25b1d">REJECT</text>
    </g>
    <g transform="translate(28 326)">
      <rect width="572" height="64" rx="10" fill="#fff" stroke="#d8dee7"/>
      <circle cx="24" cy="32" r="14" fill="#f8dddd"/><text x="24" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#b43f3f">D</text>
      <text x="52" y="27" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#334155">2025-05-29 · cloud 18%</text>
      <text x="52" y="48" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="13" fill="#64748b">coverage 91% · date delta 6 d</text>
      <rect x="468" y="18" width="80" height="28" rx="14" fill="#fbe7e7"/><text x="508" y="37" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="12" font-weight="700" fill="#b43f3f">REJECT</text>
    </g>
    <rect x="28" y="412" width="572" height="42" rx="9" fill="#edf9f3"/>
    <text x="314" y="438" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#1b7650">输出：scene ID · 日期 · 局部云量 · 覆盖率 · fallback/status</text>
  </g>

  <text x="82" y="692" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" fill="#64748b">示意：实际组合由 ROI、数据集、时间范围、覆盖率和云量阈值共同决定。</text>
</svg>
