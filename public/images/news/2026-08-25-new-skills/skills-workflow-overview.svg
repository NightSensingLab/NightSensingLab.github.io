    <text x="24" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#27684f">局部云量与覆盖率</text>
    <rect x="24" y="239" width="162" height="42" rx="8" fill="#d6f1e2"/>
    <text x="105" y="265" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#165b42">GEE Tile Temporal Mosaic</text>
  </g>

  <g transform="translate(612 176)">
    <rect width="210" height="350" rx="16" fill="#edf9f3" stroke="#9ed8bb" stroke-width="2"/>
    <circle cx="34" cy="38" r="18" fill="#1c9b67"/>
    <text x="34" y="44" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="16" font-weight="700" fill="#fff">03</text>
    <text x="24" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#165b42">日期协调</text>
    <text x="24" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="22" font-weight="700" fill="#165b42">镶嵌</text>
    <text x="24" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#27684f">日期差 / 硬约束</text>
    <text x="24" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#27684f">重叠处理与 fallback</text>
    <rect x="24" y="239" width="162" height="42" rx="8" fill="#d6f1e2"/>
    <text x="105" y="265" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="14" font-weight="600" fill="#165b42">traceable mosaic</text>
  </g>

  <g transform="translate(882 176)">
