  <text x="78" y="597" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="15" fill="#64748b">两个 skill 覆盖研究数据生产与科研成果表达的相邻环节，保留输入、选择和验证过程。</text>
